<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程｜親清日月潭</title>
<meta name="description" content="親清日月潭的拾光行程：金龍山、貓囒山淨山，水社、月牙灣、伊達邵立槳淨湖，向山－水社單車。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1ea;--ink:#1d2622;--muted:#59615c;--line:#e6e1d6;--mtn:#3d6b3c;--lake:#2f6a86;--road:#b5642c;--moss:#5f7a5a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Noto Serif TC",serif}
a{color:inherit}
.hide{display:none!important}
.hero{position:relative;min-height:420px;background:linear-gradient(180deg,rgba(10,20,18,.15),rgba(10,20,18,.78)),var(--bg) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:36px 6vw 48px}
.nav{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:.12em;gap:12px;flex-wrap:wrap}
.nav a{text-decoration:none}
.nav .brand{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:900;letter-spacing:.15em}
.nav .brand small{font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:400;letter-spacing:.12em;opacity:.85;margin-left:10px}
.menu{display:flex;gap:22px}
.menu a{padding:8px 0;border-bottom:1px solid transparent}
.menu a[aria-current="page"]{border-color:currentColor}
h1{font-size:clamp(34px,5vw,60px);line-height:1.15;font-weight:900;margin-top:60px}
.sub{font-size:clamp(16px,1.5vw,19px);opacity:.92;margin-top:14px;max-width:640px;line-height:1.7}
.sec{padding:72px 6vw 0;max-width:1240px;margin:0 auto}
.eyebrow{font-size:13px;letter-spacing:.3em;color:var(--moss);font-weight:700}
h2{font-size:clamp(26px,3vw,36px);margin:10px 0 22px;font-weight:900}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chips button{font:inherit;font-size:15px;padding:10px 18px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer;min-height:44px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:16px 30px;font-size:16px;font-weight:700;border-radius:2px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.foot{max-width:1240px;margin:80px auto 0;padding:48px 6vw 60px}
.foot .line{border-top:2px solid var(--ink);padding-top:36px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.share{display:flex;gap:12px;flex-wrap:wrap}
.hero{min-height:360px;background-position:center 35%}
.jump{display:inline-flex;background:#e7e2d6;border-radius:999px;padding:4px;flex-wrap:wrap;position:sticky;top:10px;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.jump button{font:inherit;font-size:15px;padding:9px 18px;border:0;background:transparent;color:var(--ink);border-radius:999px;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:7px}
.jump button:hover{background:#fff}
.jump i{width:9px;height:9px;border-radius:50%;display:inline-block}
.jump small{font-size:12px;color:var(--muted)}
.sr{margin-top:56px;scroll-margin-top:76px}
.sr .head{display:grid;grid-template-columns:1fr 1.15fr;border-radius:10px;overflow:hidden;background:#fff}
.sr .pic{min-height:320px;background:center/cover #ccc;position:relative}
.sr .pic:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,18,0) 40%,rgba(10,20,18,.75))}
.sr .pic div{position:absolute;left:28px;bottom:24px;color:#fff;z-index:1}
.sr .pic small{font-size:13px;letter-spacing:.3em;opacity:.9}
.sr .pic h3{font-size:40px;font-weight:900;line-height:1.2}
.sr .info{padding:32px 36px;display:flex;flex-direction:column;gap:20px}
.sr .lead{font-size:19px;line-height:1.8}
.flow{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;counter-reset:s}
.flow li{counter-increment:s;font-size:14px;line-height:1.5;border-top:2px solid var(--c);padding-top:10px}
.flow li:before{content:"0" counter(s);display:block;font-family:"Noto Serif TC",serif;font-weight:900;font-size:18px;color:var(--c);margin-bottom:4px}
.how{font-size:14px;color:var(--muted);line-height:1.8}
.how b{color:var(--ink);font-weight:500}
.tot{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:auto}
.tot div{padding-top:16px}
.tot small{display:block;font-size:13px;color:var(--muted)}
.tot b{font-size:32px;font-variant-numeric:tabular-nums;color:var(--c)}
.tot em{font-style:normal;font-size:13px;color:var(--muted);margin-left:3px}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.rt{background:#fff;border-radius:10px;padding:24px 26px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--c)}
.rt h4{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:900}
.rt .intro{font-size:15px;line-height:1.8;color:#3a443f}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px}
.meta span{font-size:13px;background:var(--paper);border-radius:999px;padding:5px 12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.own{list-style:none;counter-reset:o;font-size:14px;color:#3a443f;display:flex;flex-direction:column;gap:4px}
.own li{counter-increment:o}.own li:before{content:counter(o) "　";color:var(--c);font-weight:700}
.stat{display:flex;gap:18px;align-items:baseline;border-top:1px solid var(--line);padding-top:14px;margin-top:auto;font-size:14px;color:var(--muted);flex-wrap:wrap}
.stat b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:3px}
.stat.zero{color:var(--c);font-weight:700}
.empty{background:#fff;border-radius:8px;padding:28px;color:var(--muted);margin-top:24px}
@media (max-width:860px){.sr .head{grid-template-columns:1fr}.sr .pic{min-height:220px}.sr .pic h3{font-size:30px}.sr .info{padding:24px 22px}.flow{grid-template-columns:repeat(2,1fr)}.tot b{font-size:26px}.menu{gap:16px}.jump button{padding:9px 13px}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

/* ===== 主選單 ===== */
.nav{position:relative;z-index:20;flex-wrap:nowrap}
.menu{display:flex;gap:4px;align-items:center;margin-left:auto}
.menu a{border-bottom:0}
.mi{position:relative;flex:none}
.mi>a{display:flex;align-items:center;gap:7px;padding:12px 14px;border-radius:999px;font-size:15px;letter-spacing:.08em}
.mi>a:after{content:"";width:6px;height:6px;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg) translateY(-2px);opacity:.8}
.mi.cur>a{background:rgba(255,255,255,.2)}
.mi:hover>a,.mi:focus-within>a{background:#fff;color:#1d2622}
.sub2{position:absolute;left:0;top:100%;padding-top:8px;min-width:190px;display:none}
.mi:hover .sub2,.mi:focus-within .sub2{display:block}
.sub2 div{background:#fff;border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.sub2 a{display:block;padding:12px 14px;border-radius:8px;color:#1d2622;font-size:15px;letter-spacing:.04em}
.sub2 a:hover{background:#f4f1ea}
.cta{background:#9fd0a8;color:#0f1c1b!important;font-weight:700;padding:12px 20px;border-radius:999px;font-size:15px;margin-left:10px;white-space:nowrap;flex:none}
.cta:hover{background:#fff}
.burger{display:none}
.back a{padding:10px 0}
@media (max-width:1020px){
  .nav{flex-wrap:wrap}
  .burger{display:flex;margin-left:auto;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.25);color:#fff;font-size:20px;align-items:center;justify-content:center;cursor:pointer}
  .menu{display:none;flex-basis:100%;flex-direction:column;align-items:stretch;background:#fff;border-radius:14px;padding:10px;margin:10px 0 0;gap:0}
  .nav.open .menu{display:flex}
  .mi>a{color:#1d2622;font-weight:700;padding:14px 12px 8px}
  .mi>a:after{display:none}
  .mi.cur>a{background:none}
  .sub2{position:static;display:block;padding:0 0 8px 12px;min-width:0}
  .sub2 div{box-shadow:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .sub2 a{padding:10px 14px;background:#f4f1ea;border-radius:999px;font-size:14px}
  .cta{margin:8px 0 2px;text-align:center}
}
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="nav"><a class="brand" href="./">親清日月潭<small>by OneLife</small></a><button type="button" class="burger" aria-label="開啟選單" onclick="this.parentNode.classList.toggle('open')">☰</button><nav class="menu" aria-label="主選單"><div class="mi"><a href="about.html">關於親清</a><div class="sub2"><div><a href="about.html#why">理念</a><a href="about.html#rules">拾光守則</a><a href="about.html#who">主辦單位</a></div></div></div><div class="mi cur"><a href="trips.html" aria-current="page">行程</a><div class="sub2"><div><a href="trips.html#sr-0">山系・淨山</a><a href="trips.html#sr-1">水系・淨湖</a><a href="trips.html#sr-2">路系・單車</a></div></div></div><div class="mi"><a href="./">成果地圖</a><div class="sub2"><div><a href="./#actionmap">行動地圖</a><a href="./#growth">年度成長</a><a href="./#latest">最新行動</a></div></div></div><div class="mi"><a href="partners.html">參與企業</a><div class="sub2"><div><a href="partners.html#wall">成果牆</a><a href="partners.html#cases">歷年合作案例</a></div></div></div><div class="mi"><a href="data.html">公開數據</a><div class="sub2"><div><a href="data.html#records">全部紀錄</a><a href="data.html#method">怎麼計算</a></div></div></div><a class="cta" href="https://onelife.com.tw/">帶你的團隊來</a></nav></div>
  <div>
    <h1 class="serif">山、水、路，<br>選一條路一起行動。</h1>
    <p class="sub">每一趟都照同一套方法記錄：現場撿拾、分類、秤重，騎車就算減碳。成果會自動出現在地圖上。</p>
  </div>
</header>
<main>
<section class="sec">
  <p class="eyebrow">TRIPS</p>
  <h2 class="serif">三種方式，同一套紀錄方法</h2>
  <div class="jump" id="jump" role="group" aria-label="跳到系別"></div>
  <div id="trips"><div class="empty">載入中…</div></div>
  <p class="note" style="margin-top:20px">累積成果依每場行動的紀錄自動計算，審核後才公開。計算方法見「<a href="about.html">關於</a>」。</p>
</section>
</main>
<footer class="foot"><div class="line">
  <div><h2 class="serif" style="margin:0">想讓你的團隊，也留下一筆紀錄？</h2>
  <p class="note">執行單位：日月潭戶外運動專家有限公司 ・ 數據經執行單位審核後公開</p></div>
  <div class="share"><a class="btn ghost" href="./">看成果地圖</a><a class="btn" href="https://onelife.com.tw/">帶你的團隊來 →</a></div>
</div></footer>
<script>
var DATA_URL='https://script.google.com/macros/s/AKfycbwZdFJf-nLO6u_-TSU6CQgrqxZLqimiY1YWBzwyTEG6aAmkFtMPF_YzP1nV2jM3FALr/exec?mode=data';
var B='https://onelife.com.tw/wp-content/uploads/';
var HERO_PHOTO=B+'2024/10/DJI_0737.jpg';
var SERIES_PHOTO={'山系':B+'2025/03/EC668D5D-4006-41C8-8ECC-F72D2B0B7106-561-000000061D187710.webp','水系':B+'2024/10/DJI_0615.jpg','路系':B+'2025/08/LEOF6303.jpg'};
var COLORS={'山系':'#3d6b3c','水系':'#2f6a86','路系':'#b5642c'};
function $(id){return document.getElementById(id)}
function num(v){v=Number(v);return isFinite(v)?v:0}
function fmt(v){return (Math.round(v*10)/10).toLocaleString('zh-TW')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(cb){fetch(DATA_URL).then(function(r){return r.json()}).then(cb).catch(function(){cb(null)})}
var D=null;
var SR=[
 {k:'山系',en:'MOUNTAIN',t:'山系・淨山',lead:'走進步道，一路撿拾，把山上的垃圾帶下山。',how:'<b>怎麼算</b>　現場用吊秤秤總重量，品項照 ICC 國際淨灘紀錄表分類。',unit:'撿廢'},
 {k:'水系',en:'LAKE',t:'水系・淨湖',lead:'划著立槳出發，撈起湖面與湖岸的漂流物。',how:'<b>怎麼算</b>　上岸後分類秤重，另外記錄保麗龍碎片、釣魚線等日月潭常見的漂流物。',unit:'撿廢'},
 {k:'路系',en:'ROAD',t:'路系・單車',lead:'用踩踏取代開車，把騎過的每一公里換算成減少的碳排。沿路撿到垃圾，也一樣秤重記錄。',how:'<b>怎麼算</b>　路線公里 × 人數 ÷ 每車 4 人 × 0.2343 公斤／公里（平均汽油車）。',unit:'減碳'}];
$('hero').style.setProperty('--bg','url("'+HERO_PHOTO+'")');
$('jump').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var el=$('sr-'+b.dataset.v);if(el)el.scrollIntoView()});
load(function(d){D=d;render()});
function goHash(){var e=location.hash&&document.getElementById(location.hash.slice(1));if(e)e.scrollIntoView()}
window.addEventListener('hashchange',goHash);
function sum(list){var o={n:list.length,p:0,w:0,c:0};list.forEach(function(x){o.p+=num(x.people);o.w+=num(x.weightKg);o.c+=num(x.carbonKg)});return o}
function render(){
  if(!D){$('trips').innerHTML='<div class="empty">資料暫時讀不到，請稍後再試。</div>';return}
  var routes=D.routes||[],recs=D.records||[],h='',j='';
  SR.forEach(function(S,si){
    var rs=routes.filter(function(r){return r.series===S.k});if(!rs.length)return;
    var road=S.k==='路系',c=COLORS[S.k],T=sum(recs.filter(function(x){return x.series===S.k}));
    var common=(rs[0].steps||[]),ck=common.join('|'),who=rs.every(function(r){return r.who===rs[0].who})?rs[0].who:'',hrs=rs.every(function(r){return r.hours===rs[0].hours})?rs[0].hours:'';
    j+='<button type="button" data-v="'+si+'"><i style="background:'+c+'"></i>'+S.k+' <small>'+rs.length+' 條</small></button>';
    h+='<section class="sr" id="sr-'+si+'" style="--c:'+c+'"><div class="head"><div class="pic" style="background-image:url(&quot;'+SERIES_PHOTO[S.k]+'&quot;)"><div><small>'+S.en+'</small><h3 class="serif">'+S.t+'</h3></div></div>'+
      '<div class="info"><p class="lead">'+S.lead+'</p>'+
      (common.length?'<ol class="flow">'+common.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>':'')+
      '<p class="how">'+S.how+((who||hrs)?'<br><b>適合</b>　'+esc(who)+(hrs?'，每趟約 '+esc(hrs)+' 小時':''):'')+'</p>'+
      (T.n?'<div class="tot"><div><small>累積行動</small><b>'+T.n+'</b><em>場</em></div><div><small>參與</small><b>'+fmt(T.p)+'</b><em>人次</em></div><div><small>'+S.unit+'</small><b>'+fmt(road?T.c:T.w)+'</b><em>公斤</em></div></div>'
           :'<p class="how" style="border-top:1px solid var(--line);padding-top:16px;margin-top:auto;color:var(--c);font-weight:700">這一系還沒有紀錄，第一筆正在路上。</p>')+
      '</div></div><div class="routes">'+
      rs.map(function(r){
        var t=sum(recs.filter(function(x){return x.route===r.name}));
        var meta=[['地點',r.end||r.start],['距離',r.km!==''&&r.km!=null?r.km+' 公里':''],['時間',!hrs&&r.hours?'約 '+r.hours+' 小時':''],['適合',!who?r.who:'']].filter(function(m){return m[1]});
        var own=(r.steps||[]).join('|')!==ck&&(r.steps||[]).length;
        return '<article class="rt"><h4>'+esc(r.name)+'</h4>'+(r.intro?'<p class="intro">'+esc(r.intro)+'</p>':'')+
          '<div class="meta">'+meta.map(function(m){return '<span>'+m[0]+' <b>'+esc(m[1])+'</b></span>'}).join('')+'</div>'+
          (own?'<ol class="own">'+r.steps.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>':'')+
          (t.n?'<p class="stat"><span><b>'+t.n+'</b>場</span><span><b>'+fmt(t.p)+'</b>人次</span><span><b>'+fmt(road?t.c:t.w)+'</b>公斤'+S.unit+'</span>'+(road&&t.w>0?'<span><b>'+fmt(t.w)+'</b>公斤撿廢</span>':'')+'</p>'
              :'<p class="stat zero">還沒有紀錄，等第一支隊伍。</p>')+
          '</article>';
      }).join('')+'</div></section>';
  });
  $('jump').innerHTML=j;
  $('trips').innerHTML=h||'<div class="empty">目前還沒有公開的行程。</div>';
  goHash();
}
</script>
</body>
</html>
