<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程｜親清日月潭</title>
<meta name="description" content="親清日月潭的拾光行程：金龍山、貓囒山淨山，水社、月牙灣、伊達邵立槳淨湖，向山－水社單車。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1ea;--ink:#1d2622;--muted:#59615c;--line:#e6e1d6;--mtn:#3d6b3c;--lake:#2f6a86;--road:#b5642c;--moss:#5f7a5a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Noto Serif TC",serif}
a{color:inherit}
.hide{display:none!important}
.hero{position:relative;min-height:420px;background:linear-gradient(180deg,rgba(10,20,18,.15),rgba(10,20,18,.78)),var(--bg) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:36px 6vw 48px}
.nav{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:.12em;gap:12px;flex-wrap:wrap}
.nav a{text-decoration:none}
.nav .brand{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:900;letter-spacing:.15em}
.menu{display:flex;gap:22px}
.menu a{padding:8px 0;border-bottom:1px solid transparent}
.menu a[aria-current="page"]{border-color:currentColor}
h1{font-size:clamp(34px,5vw,60px);line-height:1.15;font-weight:900;margin-top:60px}
.sub{font-size:clamp(16px,1.5vw,19px);opacity:.92;margin-top:14px;max-width:640px;line-height:1.7}
.sec{padding:72px 6vw 0;max-width:1240px;margin:0 auto}
.eyebrow{font-size:13px;letter-spacing:.3em;color:var(--moss);font-weight:700}
h2{font-size:clamp(26px,3vw,36px);margin:10px 0 22px;font-weight:900}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chips button{font:inherit;font-size:15px;padding:10px 18px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer;min-height:44px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:16px 30px;font-size:16px;font-weight:700;border-radius:2px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.foot{max-width:1240px;margin:80px auto 0;padding:48px 6vw 60px}
.foot .line{border-top:2px solid var(--ink);padding-top:36px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.share{display:flex;gap:12px;flex-wrap:wrap}
.trips{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.trip{background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.trip .ph{height:240px;background:center/cover #ccc;position:relative}
.trip .tag{position:absolute;left:18px;top:18px;color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;letter-spacing:.1em}
.trip .bd{padding:26px 28px 30px;display:flex;flex-direction:column;gap:14px;flex:1}
.trip h3{font-size:26px;font-weight:900}
.trip .intro{font-size:16px;line-height:1.8;color:#3a443f}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.steps li{counter-increment:s;font-size:15px;display:flex;gap:10px;align-items:baseline}
.steps li:before{content:counter(s);font-family:"Noto Serif TC",serif;font-weight:900;color:var(--moss);min-width:16px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-radius:6px;margin-top:auto}
.stat div{padding:14px 16px}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12px;color:var(--muted);margin-left:3px}
.empty{background:#fff;border-radius:8px;padding:28px;color:var(--muted)}
@media (max-width:860px){.trips{grid-template-columns:1fr}.trip .ph{height:200px}.menu{gap:16px}}
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="nav"><a class="brand" href="./">親清日月潭</a><nav class="menu" aria-label="主選單"><a href="./">首頁</a><a href="trips.html" aria-current="page">行程</a><a href="about.html">關於</a></nav></div>
  <div>
    <h1 class="serif">山、水、路，<br>選一條路一起行動。</h1>
    <p class="sub">每一趟都照同一套方法記錄：現場撿拾、分類、秤重，騎車就算減碳。成果會自動出現在地圖上。</p>
  </div>
</header>
<main>
<section class="sec">
  <p class="eyebrow">TRIPS</p>
  <h2 class="serif">日月潭的拾光行程</h2>
  <div class="chips" id="f" role="group" aria-label="篩選系別">
    <button type="button" data-v="全部" aria-pressed="true">全部</button>
    <button type="button" data-v="山系" aria-pressed="false">山系・淨山</button>
    <button type="button" data-v="水系" aria-pressed="false">水系・淨湖</button>
    <button type="button" data-v="路系" aria-pressed="false">路系・單車</button>
  </div>
  <div class="trips" id="trips"><div class="empty">載入中…</div></div>
  <p class="note">累積成果依每場行動的紀錄自動計算；撿廢一律現場秤重，減碳以平均汽油車 0.2343 公斤／公里、每車 4 人計算。</p>
</section>
</main>
<footer class="foot"><div class="line">
  <div><h2 class="serif" style="margin:0">想讓你的團隊，也留下一筆紀錄？</h2>
  <p class="note">執行單位：日月潭戶外運動專家有限公司 ・ 數據經執行單位審核後公開</p></div>
  <div class="share"><a class="btn ghost" href="./">看成果地圖</a><a class="btn" href="https://onelife.com.tw/">企業想參與 →</a></div>
</div></footer>
<script>
var DATA_URL='https://script.google.com/macros/s/AKfycbwZdFJf-nLO6u_-TSU6CQgrqxZLqimiY1YWBzwyTEG6aAmkFtMPF_YzP1nV2jM3FALr/exec?mode=data';
var B='https://onelife.com.tw/wp-content/uploads/';
var HERO_PHOTO=B+'2024/10/DJI_0737.jpg';
var SERIES_PHOTO={'山系':B+'2025/03/EC668D5D-4006-41C8-8ECC-F72D2B0B7106-561-000000061D187710.webp','水系':B+'2024/10/DJI_0615.jpg','路系':B+'2025/08/LEOF6303.jpg'};
var COLORS={'山系':'#3d6b3c','水系':'#2f6a86','路系':'#b5642c'};
function $(id){return document.getElementById(id)}
function num(v){v=Number(v);return isFinite(v)?v:0}
function fmt(v){return (Math.round(v*10)/10).toLocaleString('zh-TW')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(cb){fetch(DATA_URL).then(function(r){return r.json()}).then(cb).catch(function(){cb(null)})}
var D=null,f='全部';
$('hero').style.setProperty('--bg','url("'+SERIES_PHOTO['水系']+'")');
$('f').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call($('f').children,function(x){x.setAttribute('aria-pressed',x===b)});f=b.dataset.v;render()});
load(function(d){D=d;render()});
function render(){
  if(!D){$('trips').innerHTML='<div class="empty">資料暫時讀不到，請稍後再試。</div>';return}
  var O={'山系':0,'水系':1,'路系':2};
  var rs=(D.routes||[]).filter(function(r){return f==='全部'||r.series===f}).sort(function(a,b){return (O[a.series]||0)-(O[b.series]||0)});
  if(!rs.length){$('trips').innerHTML='<div class="empty">這個系別還沒有行程。</div>';return}
  $('trips').innerHTML=rs.map(function(r){
    var list=(D.records||[]).filter(function(x){return x.route===r.name}),p=0,w=0,c=0;
    list.forEach(function(x){p+=num(x.people);w+=num(x.weightKg);c+=num(x.carbonKg)});
    var road=r.series==='路系',pt=(D.points||{})[r.start],photo=(pt&&pt.photo)||SERIES_PHOTO[r.series]||HERO_PHOTO;
    var meta=[['地點',r.start+(r.end?' → '+r.end:'')],['距離',r.km!==''&&r.km!=null?r.km+' 公里':''],['時間',r.hours?'約 '+r.hours+' 小時':''],['適合',r.who]].filter(function(m){return m[1]});
    return '<article class="trip"><div class="ph" style="background-image:url(&quot;'+esc(photo)+'&quot;)"><span class="tag" style="background:'+(COLORS[r.series]||'#1d2622')+'">'+esc(r.series)+'</span></div>'+
      '<div class="bd"><h3 class="serif">'+esc(r.name)+'</h3>'+(r.intro?'<p class="intro">'+esc(r.intro)+'</p>':'')+
      '<div class="meta">'+meta.map(function(m){return '<span>'+m[0]+' <b>'+esc(m[1])+'</b></span>'}).join('')+'</div>'+
      (r.steps&&r.steps.length?'<ol class="steps">'+r.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+
      '<div class="stat"><div><small>累積行動</small><b>'+list.length+'</b><em>場</em></div><div><small>參與</small><b>'+fmt(p)+'</b><em>人次</em></div><div><small>'+(road?'減碳':'撿廢')+'</small><b>'+fmt(road?c:w)+'</b><em>公斤</em></div></div>'+
      '</div></article>';
  }).join('');
}
</script>
</body>
</html>
